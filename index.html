<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expo Flow</title>
<meta name="description" content="Diagrama de flujo interactivo para exposiciones y discursos">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expo Flow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<style>
/* ── RESET & TOKENS ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f2f5; --surface: #fff; --border: #e2e8f0;
  --text: #0f172a; --muted: #64748b; --hint: #94a3b8;
  --blue: #1d4ed8; --blue-dark: #1e3a8a; --blue-light: #dbeafe;
  --teal: #0f766e; --red: #dc2626; --green: #16a34a; --accent: #3b82f6;
  --radius: 12px;
  --topbar-h: 52px;
  --bottomnav-h: 64px;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

/* ══════════════════════════════════════
   DESKTOP LAYOUT (≥ 680px)
══════════════════════════════════════ */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* Top bar */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 1.25rem; height: var(--topbar-h);
  display: flex; align-items: center; gap: .75rem;
  flex-shrink: 0; z-index: 20;
}
.topbar h1 { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-btn {
  padding: 5px 12px; font-size: 12px; font-weight: 500;
  border: 1px solid var(--border); border-radius: 20px;
  background: transparent; color: var(--muted); cursor: pointer;
  white-space: nowrap; transition: background .15s; flex-shrink: 0;
}
.topbar-btn:hover { background: var(--bg); color: var(--text); }

/* Main row */
.main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 300px; flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  transition: width .25s ease;
}
.sidebar.collapsed { width: 0; }
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.stab {
  flex: 1; padding: 10px 4px; font-size: 12px; font-weight: 500;
  text-align: center; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; transition: color .15s;
  white-space: nowrap; user-select: none;
}
.stab.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab-panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; -webkit-overflow-scrolling: touch; }
.tab-panel.active { display: flex; }

/* Canvas */
.canvas-wrap {
  flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 1.5rem;
}
svg#flow { max-width: 480px; width: 100%; filter: drop-shadow(0 2px 8px rgba(0,0,0,.06)); }

/* Bottom nav — hidden on desktop */
.bottom-nav { display: none; }
/* Sheet — hidden on desktop */
.sheet-backdrop { display: none; }
.sheet { display: none; }

/* ══════════════════════════════════════
   MOBILE LAYOUT (< 680px)
══════════════════════════════════════ */
@media (max-width: 679px) {

  .app { height: 100dvh; }

  /* Topbar slimmer on mobile */
  .topbar { padding: 0 1rem; gap: .5rem; }
  .topbar h1 { font-size: 13px; }
  /* Hide desktop panel toggle on mobile */
  .topbar-btn.desktop-only { display: none; }

  /* Main: single column, no sidebar */
  .main { flex-direction: column; }

  /* Sidebar completely hidden on mobile — replaced by sheet */
  .sidebar { display: none !important; }

  /* Canvas takes full width, leaves room for topbar + bottom nav */
  .canvas-wrap {
    flex: 1;
    padding: 1rem .75rem;
    padding-bottom: calc(var(--bottomnav-h) + .5rem);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    align-items: flex-start;
    justify-content: center;
  }
  svg#flow { max-width: 100%; width: 100%; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--bottomnav-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 30;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bnav-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; background: none; border: none;
    color: var(--hint); cursor: pointer;
    font-size: 10px; font-weight: 500;
    transition: color .15s; padding: 8px 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .bnav-btn.active { color: var(--blue); }
  .bnav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── BOTTOM SHEET ── */
  .sheet-backdrop {
    display: block;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 40;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    display: flex; flex-direction: column;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    z-index: 50;
    max-height: 80dvh;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,0,.67,0);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open { transform: translateY(0); transition-timing-function: cubic-bezier(.33,1,.68,1); }

  .sheet-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--border); margin: 10px auto 6px;
    flex-shrink: 0;
  }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 1rem 10px; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .sheet-title { font-size: 13px; font-weight: 600; color: var(--muted); }
  .sheet-close {
    background: none; border: none; font-size: 20px;
    color: var(--hint); cursor: pointer; line-height: 1; padding: 0 4px;
  }
  .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* Sheet pages */
  .sheet-page { display: none; padding: 1rem; }
  .sheet-page.active { display: block; }

  /* Full-screen panel pages (bosquejo, historial) */
  .fullpage {
    position: fixed; inset: 0;
    background: var(--surface);
    z-index: 60;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.32,0,.67,0);
  }
  .fullpage.open { transform: translateX(0); transition-timing-function: cubic-bezier(.33,1,.68,1); }
  .fullpage-header {
    display: flex; align-items: center; gap: .75rem;
    padding: .85rem 1rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .fullpage-back {
    background: none; border: none; cursor: pointer;
    color: var(--blue); font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 4px;
    padding: 0; -webkit-tap-highlight-color: transparent;
  }
  .fullpage-back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fullpage-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .fullpage-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1rem; display: flex; flex-direction: column; gap: 10px; }
}

/* ── SHARED COMPONENTS ── */

/* Detail content */
.detail-wrap { padding: 1.25rem; flex: 1; }
.detail-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 160px; color: var(--hint); text-align: center; gap: 8px; }
.detail-empty .icon { font-size: 26px; }
.detail-empty p { font-size: 13px; }
.dp-tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; background: var(--blue-light); color: var(--blue-dark); margin-bottom: 10px; }
.dp-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
.dp-body { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 12px; }
.dp-points { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.dp-points li { font-size: 13px; color: #334155; padding: 8px 10px 8px 14px; background: var(--bg); border-radius: 6px; position: relative; line-height: 1.4; }
.dp-points li::before { content: "→"; position: absolute; left: 4px; top: 9px; color: var(--hint); font-size: 10px; }

/* Form elements */
.field-label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
.field-input { width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none; font-family: inherit; }
.field-input:focus { border-color: var(--accent); background: #fff; }
.field-textarea { width: 100%; resize: none; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 13px; line-height: 1.6; font-family: inherit; color: var(--text); background: var(--bg); outline: none; min-height: 140px; }
.field-textarea:focus { border-color: var(--accent); background: #fff; }
.field-textarea.mono { font-family: monospace; font-size: 11px; min-height: 80px; }

/* Buttons */
.btn { width: 100%; padding: 11px; font-size: 14px; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; transition: background .15s; -webkit-tap-highlight-color: transparent; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:active { background: var(--blue-dark); }
.btn-teal { background: var(--teal); color: #fff; }
.btn-teal:active { background: #0d6460; }

/* Divider */
.divider { border: none; border-top: 1px solid var(--border); margin: .5rem 0; }

/* Hint text */
.hint-text { font-size: 11px; color: var(--hint); line-height: 1.5; text-align: center; }

/* Historial */
.hist-list { display: flex; flex-direction: column; gap: 8px; }
.hist-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; transition: border-color .15s; display: flex; align-items: center; gap: 10px; -webkit-tap-highlight-color: transparent; }
.hist-item:active { background: var(--blue-light); }
.hist-item.loaded { border-color: var(--blue); background: var(--blue-light); }
.hist-info { flex: 1; min-width: 0; }
.hist-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-date { font-size: 11px; color: var(--hint); margin-top: 2px; }
.hist-del { flex-shrink: 0; background: transparent; border: none; color: var(--hint); cursor: pointer; font-size: 20px; line-height: 1; padding: 4px 6px; }
.hist-del:active { color: var(--red); }
.hist-empty { font-size: 13px; color: var(--hint); text-align: center; padding: 2rem 0; }

/* SVG nodes */
.node-g { cursor: pointer; }
.node-g rect, .node-g polygon { transition: filter .12s; }
.node-g:hover rect, .node-g:hover polygon { filter: brightness(.88); }
.node-g.active rect { stroke-width: 2.5 !important; filter: brightness(.85); }
.pill-start { fill: #dc2626; stroke: #991b1b; stroke-width: 1; }
.pill-end   { fill: #16a34a; stroke: #166534; stroke-width: 1; }
.pill-text  { font-size: 13px; font-weight: 600; fill: #fff; font-family: -apple-system,sans-serif; }
.box-blue   { fill: #1d4ed8; stroke: #1e3a8a; stroke-width: 0.5; }
.box-teal   { fill: #0f766e; stroke: #134e4a; stroke-width: 0.5; }
.box-txt    { font-size: 12px; font-weight: 500; fill: #fff; font-family: -apple-system,sans-serif; }
.arr-line   { stroke: #94a3b8; stroke-width: 1.5; fill: none; }

/* Toast */
.toast { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 20px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 999; white-space: nowrap; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Desktop detail/bosquejo/historial panels inside sidebar */
.bosquejo-wrap { padding: 1rem; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.bosquejo-wrap label { font-size: 12px; font-weight: 600; color: var(--muted); }
.bosquejo-wrap textarea { flex: 1; min-height: 140px; resize: none; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.6; font-family: inherit; color: var(--text); background: var(--bg); outline: none; }
.bosquejo-wrap textarea:focus { border-color: var(--accent); background: #fff; }
.bosquejo-wrap .title-field { padding: 7px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none; font-family: inherit; width: 100%; }
.bosquejo-wrap .title-field:focus { border-color: var(--accent); background: #fff; }
.bosquejo-wrap .gen-btn { padding: 9px; font-size: 13px; font-weight: 600; background: var(--blue); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
.import-section { border-top: 1px solid var(--border); padding: 1rem; display: flex; flex-direction: column; gap: 8px; }
.import-section label { font-size: 12px; font-weight: 600; color: var(--muted); }
.import-section textarea { min-height: 70px; resize: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 11px; font-family: monospace; color: var(--text); background: var(--bg); outline: none; }
.import-section textarea:focus { border-color: var(--accent); background: #fff; }
.import-btn { padding: 7px; font-size: 12px; font-weight: 600; background: var(--teal); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
.import-hint { font-size: 11px; color: var(--hint); line-height: 1.5; }
.historial-wrap { padding: 1rem; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.section-label { font-size: 12px; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
<div class="app">

  <!-- ── TOP BAR ── -->
  <div class="topbar">
    <h1 id="expo-title">Ejemplo: Proceso de pedido</h1>
    <button class="topbar-btn desktop-only" onclick="toggleSidebar()">☰ Panel</button>
  </div>

  <div class="main">

    <!-- ── DESKTOP SIDEBAR ── -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-tabs">
        <div class="stab active" onclick="switchTab('detail')">Detalle</div>
        <div class="stab" onclick="switchTab('bosquejo')">Bosquejo</div>
        <div class="stab" onclick="switchTab('historial')">Historial</div>
      </div>

      <!-- Detail -->
      <div class="tab-panel active" id="tab-detail">
        <div class="detail-wrap">
          <div class="detail-empty" id="detail-empty-desk">
            <div class="icon">👆</div><p>Haz click en cualquier nodo</p>
          </div>
          <div id="detail-content-desk" style="display:none">
            <span class="dp-tag" id="dp-tag-desk"></span>
            <div class="dp-title" id="dp-title-desk"></div>
            <div class="dp-body" id="dp-body-desk"></div>
            <ul class="dp-points" id="dp-points-desk"></ul>
          </div>
        </div>
      </div>

      <!-- Bosquejo desktop -->
      <div class="tab-panel" id="tab-bosquejo">
        <div class="bosquejo-wrap">
          <label>Título</label>
          <input class="title-field" type="text" id="desk-title" placeholder="Título de la exposición..."/>
          <label>Bosquejo</label>
          <textarea id="desk-bosquejo" placeholder="Pega tu bosquejo aquí..."></textarea>
          <button class="gen-btn" onclick="prepararParaClaude('desk')">Copiar prompt para Claude ✨</button>
        </div>
        <div class="import-section">
          <label>Pega el JSON de Claude</label>
          <p class="import-hint">Copia el JSON que Claude te devuelva y pégalo aquí.</p>
          <textarea id="desk-json" placeholder='{"title":"...","nodes":[...]}'></textarea>
          <button class="import-btn" onclick="importarJSON('desk')">✓ Cargar diagrama</button>
        </div>
      </div>

      <!-- Historial desktop -->
      <div class="tab-panel" id="tab-historial">
        <div class="historial-wrap">
          <div class="section-label">Bosquejos guardados</div>
          <div class="hist-list" id="hist-list-desk"></div>
        </div>
      </div>
    </div>

    <!-- ── CANVAS ── -->
    <div class="canvas-wrap">
      <svg id="flow" viewBox="0 0 480 560">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <g class="node-g" id="n-intro" onclick="show('intro')">
          <rect x="140" y="20" width="200" height="44" rx="22" class="pill-start"/>
          <text x="240" y="42" text-anchor="middle" dominant-baseline="central" class="pill-text">Orden en teléfono</text>
        </g>
        <line x1="240" y1="64" x2="240" y2="118" class="arr-line" marker-end="url(#arr)"/>
        <g class="node-g" id="n-comanda" onclick="show('comanda')">
          <rect x="140" y="118" width="200" height="44" rx="8" class="box-teal"/>
          <text x="240" y="140" text-anchor="middle" dominant-baseline="central" class="box-txt">Registrar comanda</text>
        </g>
        <line x1="240" y1="162" x2="240" y2="216" class="arr-line" marker-end="url(#arr)"/>
        <g class="node-g" id="n-prod" onclick="show('prod')">
          <rect x="140" y="216" width="200" height="44" rx="8" class="box-blue"/>
          <text x="240" y="238" text-anchor="middle" dominant-baseline="central" class="box-txt">Enviar a producción</text>
        </g>
        <line x1="240" y1="260" x2="240" y2="314" class="arr-line" marker-end="url(#arr)"/>
        <g class="node-g" id="n-entrega" onclick="show('entrega')">
          <rect x="140" y="314" width="200" height="44" rx="8" class="box-blue"/>
          <text x="240" y="336" text-anchor="middle" dominant-baseline="central" class="box-txt">Programar entrega</text>
        </g>
        <line x1="240" y1="358" x2="240" y2="412" class="arr-line" marker-end="url(#arr)"/>
        <g class="node-g" id="n-cierre" onclick="show('cierre')">
          <rect x="140" y="412" width="200" height="44" rx="22" class="pill-end"/>
          <text x="240" y="434" text-anchor="middle" dominant-baseline="central" class="pill-text">Entrega al cliente</text>
        </g>
      </svg>
    </div>
  </div>
</div>

<!-- ── MOBILE: BOTTOM NAV ── -->
<nav class="bottom-nav">
  <button class="bnav-btn active" id="bnav-diagrama" onclick="mobileNav('diagrama')">
    <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="4" rx="1"/><line x1="12" y1="6" x2="12" y2="10"/><rect x="7" y="10" width="10" height="4" rx="1"/><line x1="12" y1="14" x2="12" y2="18"/><rect x="9" y="18" width="6" height="4" rx="1"/></svg>
    Diagrama
  </button>
  <button class="bnav-btn" id="bnav-bosquejo" onclick="mobileNav('bosquejo')">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    Bosquejo
  </button>
  <button class="bnav-btn" id="bnav-historial" onclick="mobileNav('historial')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Historial
  </button>
</nav>

<!-- ── MOBILE: DETAIL SHEET ── -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="sheet-label">Detalle</span>
    <button class="sheet-close" onclick="closeSheet()">×</button>
  </div>
  <div class="sheet-body">
    <div class="detail-wrap">
      <span class="dp-tag" id="dp-tag-mob"></span>
      <div class="dp-title" id="dp-title-mob"></div>
      <div class="dp-body" id="dp-body-mob"></div>
      <ul class="dp-points" id="dp-points-mob"></ul>
    </div>
  </div>
</div>

<!-- ── MOBILE: BOSQUEJO FULLPAGE ── -->
<div class="fullpage" id="page-bosquejo">
  <div class="fullpage-header">
    <button class="fullpage-back" onclick="closePage('bosquejo')">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver
    </button>
    <span class="fullpage-title">Nuevo bosquejo</span>
  </div>
  <div class="fullpage-body" id="bosquejo-body">
    <label class="field-label">Título de la exposición</label>
    <input class="field-input" type="text" id="mob-title" placeholder="Ej: Mi plan de ventas Q3..."/>
    <label class="field-label">Bosquejo</label>
    <textarea class="field-textarea" id="mob-bosquejo" placeholder="Escribe o pega tu bosquejo aquí. Puede ser tan desordenado como quieras — notas, bullet points, párrafos..."></textarea>
    <button class="btn btn-primary" onclick="prepararParaClaude('mob')">1. Copiar prompt para Claude ✨</button>
    <hr class="divider"/>
    <label class="field-label">Pega aquí el JSON que te dio Claude</label>
    <p class="hint-text" style="text-align:left; margin-bottom:4px">Claude te devolverá un JSON. Cópialo completo y pégalo aquí.</p>
    <textarea class="field-textarea mono" id="mob-json" placeholder='{"title":"...","nodes":[]}'></textarea>
    <button class="btn btn-teal" onclick="importarJSON('mob')">2. Cargar diagrama ✓</button>
  </div>
</div>

<!-- ── MOBILE: HISTORIAL FULLPAGE ── -->
<div class="fullpage" id="page-historial">
  <div class="fullpage-header">
    <button class="fullpage-back" onclick="closePage('historial')">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Volver
    </button>
    <span class="fullpage-title">Historial</span>
  </div>
  <div class="fullpage-body">
    <div class="hist-list" id="hist-list-mob"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'expo_flow_v3';
let nodeData = {
  intro:   { tag:"Inicio", title:"Orden en teléfono", body:"Confirmar datos del pedido antes de cualquier acción.", points:["Nombre del cliente","Tipo de pedido","Detalles especiales"] },
  comanda: { tag:"Registro", title:"Registrar comanda", body:"Documento central — debe tener todo especificado.", points:["Detalle completo","Instrucciones especiales","Referencia de seguimiento"] },
  prod:    { tag:"Producción", title:"Enviar a producción", body:"Cocina ejecuta según la comanda. Control de calidad antes de liberar.", points:["Seguir especificaciones","Verificar presentación","Listo para despacho"] },
  entrega: { tag:"Logística", title:"Programar entrega", body:"Asignar responsable y definir método de entrega.", points:["Confirmar dirección","Asignar responsable","Notificar al cliente"] },
  cierre:  { tag:"Cierre", title:"Entrega al cliente", body:"Confirmar recepción y cerrar la orden.", points:["Confirmar recepción","Registrar cierre","Feedback si aplica"] }
};
let currentHistId = null;
let sidebarOpen = true;
const isMobile = () => window.innerWidth < 680;

/* ── TOAST ── */
function toast(msg, dur=2800) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

/* ── DESKTOP: SIDEBAR ── */
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
}
function switchTab(name) {
  const tabs = ['detail','bosquejo','historial'];
  document.querySelectorAll('.stab').forEach((t,i) => t.classList.toggle('active', tabs[i]===name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='historial') renderHistorial('desk');
}

/* ── MOBILE: NAV ── */
function mobileNav(page) {
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('bnav-'+page).classList.add('active');
  if (page === 'bosquejo') openPage('bosquejo');
  else if (page === 'historial') { renderHistorial('mob'); openPage('historial'); }
  // 'diagrama' just closes pages
}
function openPage(name) {
  document.getElementById('page-'+name).classList.add('open');
}
function closePage(name) {
  document.getElementById('page-'+name).classList.remove('open');
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('bnav-diagrama').classList.add('active');
}

/* ── MOBILE: SHEET ── */
function openSheet(id) {
  const d = nodeData[id]; if (!d) return;
  document.getElementById('sheet-label').textContent = d.tag;
  document.getElementById('dp-tag-mob').textContent = d.tag;
  document.getElementById('dp-title-mob').textContent = d.title;
  document.getElementById('dp-body-mob').textContent = d.body;
  const ul = document.getElementById('dp-points-mob'); ul.innerHTML = '';
  (d.points||[]).forEach(p => { const li=document.createElement('li'); li.textContent=p; ul.appendChild(li); });
  document.getElementById('sheet-backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheet-backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

/* ── SHOW NODE (unified) ── */
function show(id) {
  document.querySelectorAll('.node-g').forEach(n => n.classList.remove('active'));
  document.getElementById('n-'+id)?.classList.add('active');

  if (isMobile()) {
    openSheet(id);
  } else {
    const d = nodeData[id]; if (!d) return;
    document.getElementById('detail-empty-desk').style.display = 'none';
    const c = document.getElementById('detail-content-desk'); c.style.display = 'block';
    document.getElementById('dp-tag-desk').textContent = d.tag;
    document.getElementById('dp-title-desk').textContent = d.title;
    document.getElementById('dp-body-desk').textContent = d.body;
    const ul = document.getElementById('dp-points-desk'); ul.innerHTML = '';
    (d.points||[]).forEach(p => { const li=document.createElement('li'); li.textContent=p; ul.appendChild(li); });
    if (!sidebarOpen) toggleSidebar();
    switchTab('detail');
  }
}

/* ── PROMPT FOR CLAUDE ── */
function prepararParaClaude(ctx) {
  const bosquejo = document.getElementById(ctx==='mob' ? 'mob-bosquejo' : 'desk-bosquejo').value.trim();
  const titulo   = document.getElementById(ctx==='mob' ? 'mob-title' : 'desk-title').value.trim();
  if (!bosquejo) { toast('⚠️ Pega tu bosquejo primero.'); return; }

  const prompt = `Convierte este bosquejo en un JSON para mi diagrama de exposición.

Devuelve SOLO el JSON, sin explicación, sin markdown, sin bloques de código. Solo el JSON puro empezando con { y terminando con }.

Estructura requerida:
{
  "title": "Título de la exposición",
  "nodes": [
    {
      "id": "node_1",
      "label": "Etiqueta corta (máx 4 palabras)",
      "tag": "Categoría (ej: Introducción, Argumento, Cierre)",
      "title": "Título completo del nodo",
      "body": "Una frase de recordatorio para improvisar (máx 20 palabras)",
      "points": ["Punto clave 1", "Punto clave 2", "Punto clave 3"]
    }
  ]
}

Reglas:
- Mínimo 4 nodos, máximo 8
- Primer nodo: introducción/gancho
- Último nodo: cierre/conclusión
- Los points son frases CORTAS para improvisar, no para leer
- Flujo lineal: un nodo lleva al siguiente
${titulo ? '- Título: ' + titulo : ''}

Bosquejo:
${bosquejo}`;

  navigator.clipboard.writeText(prompt).then(() => {
    toast('✓ Prompt copiado — pégalo en Claude');
  }).catch(() => {
    const ta=document.createElement('textarea'); ta.value=prompt;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    toast('✓ Prompt copiado — pégalo en Claude');
  });
}

/* ── IMPORT JSON ── */
function importarJSON(ctx) {
  let raw = document.getElementById(ctx==='mob' ? 'mob-json' : 'desk-json').value.trim();
  if (!raw) { toast('⚠️ Pega el JSON de Claude primero.'); return; }
  raw = raw.replace(/^```[a-z]*\n?/,'').replace(/```$/,'').trim();
  try {
    const parsed = JSON.parse(raw);
    if (!parsed.nodes || !Array.isArray(parsed.nodes)) throw new Error('bad');
    nodeData = {};
    parsed.nodes.forEach(n => { nodeData[n.id] = n; });
    renderSVG(parsed.nodes);
    const t = parsed.title || document.getElementById(ctx==='mob'?'mob-title':'desk-title').value.trim() || 'Mi exposición';
    document.getElementById('expo-title').textContent = t;
    document.getElementById(ctx==='mob'?'mob-json':'desk-json').value = '';

    const entry = {
      id: Date.now(), title: t,
      date: new Date().toLocaleString('es-DO'),
      bosquejo: document.getElementById(ctx==='mob'?'mob-bosquejo':'desk-bosquejo').value.trim(),
      nodeData: JSON.parse(JSON.stringify(nodeData)),
      svgNodes: parsed.nodes
    };
    saveHistorial(entry); currentHistId = entry.id;

    if (ctx==='mob') { closePage('bosquejo'); }
    else { document.getElementById('detail-empty-desk').style.display='flex'; document.getElementById('detail-content-desk').style.display='none'; switchTab('detail'); }
    toast('✓ Diagrama cargado y guardado');
  } catch(e) { toast('⚠️ JSON inválido — copia el bloque completo'); }
}

/* ── RENDER SVG ── */
function renderSVG(nodes) {
  const svg = document.getElementById('flow');
  const oldDefs = svg.querySelector('defs');
  svg.innerHTML = ''; svg.appendChild(oldDefs);
  const W=480, nodeH=46, nodeW=240, rowGap=72, startY=24;
  const svgH = startY + nodes.length*(nodeH+rowGap)+20;
  svg.setAttribute('viewBox',`0 0 ${W} ${svgH}`);
  const NS='http://www.w3.org/2000/svg';
  const mk=(tag,a)=>{ const el=document.createElementNS(NS,tag); for(const[k,v] of Object.entries(a)) el.setAttribute(k,v); return el; };
  const colors=['box-blue','box-teal','box-blue','box-teal','box-blue','box-teal','box-blue'];
  let prevY=null;
  nodes.forEach((node,i)=>{
    const y=startY+i*(nodeH+rowGap), cx=W/2, x=cx-nodeW/2;
    const isFirst=i===0, isLast=i===nodes.length-1;
    if(prevY!==null) svg.appendChild(mk('line',{x1:cx,y1:prevY,x2:cx,y2:y,class:'arr-line','marker-end':'url(#arr)'}));
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','node-g'); g.setAttribute('id','n-'+node.id);
    g.setAttribute('onclick',`show('${node.id}')`);
    const rx=(isFirst||isLast)?23:8;
    const bc=isFirst?'pill-start':isLast?'pill-end':colors[i%colors.length];
    g.appendChild(mk('rect',{x,y,width:nodeW,height:nodeH,rx,class:bc}));
    const txt=document.createElementNS(NS,'text');
    txt.setAttribute('x',cx); txt.setAttribute('y',y+nodeH/2);
    txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','central');
    txt.setAttribute('class',(isFirst||isLast)?'pill-text':'box-txt');
    const label=node.label||'';
    if(label.length>20){
      const words=label.split(' '), half=Math.ceil(words.length/2);
      const ts1=document.createElementNS(NS,'tspan'); ts1.setAttribute('x',cx); ts1.setAttribute('dy','-0.6em'); ts1.textContent=words.slice(0,half).join(' ');
      const ts2=document.createElementNS(NS,'tspan'); ts2.setAttribute('x',cx); ts2.setAttribute('dy','1.2em'); ts2.textContent=words.slice(half).join(' ');
      txt.appendChild(ts1); txt.appendChild(ts2);
    } else { txt.textContent=label; }
    g.appendChild(txt); svg.appendChild(g);
    prevY=y+nodeH;
  });
}

/* ── HISTORIAL ── */
function getHistorial(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch{return[];} }
function saveHistorial(entry){ const h=getHistorial(); h.unshift(entry); localStorage.setItem(STORAGE_KEY,JSON.stringify(h.slice(0,30))); }
function deleteFromHistorial(id,e){
  e.stopPropagation();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(getHistorial().filter(x=>x.id!==id)));
  renderHistorial(isMobile()?'mob':'desk'); toast('Borrado.');
}
function loadFromHistorial(entry){
  nodeData=entry.nodeData; renderSVG(entry.svgNodes);
  document.getElementById('expo-title').textContent=entry.title;
  currentHistId=entry.id;
  if(isMobile()) closePage('historial');
  else { document.getElementById('detail-empty-desk').style.display='flex'; document.getElementById('detail-content-desk').style.display='none'; switchTab('detail'); }
  renderHistorial(isMobile()?'mob':'desk');
  toast('✓ Diagrama cargado');
}
function renderHistorial(ctx){
  const listId = ctx==='mob' ? 'hist-list-mob' : 'hist-list-desk';
  const list = document.getElementById(listId);
  const hist = getHistorial();
  if(!hist.length){ list.innerHTML='<div class="hist-empty">Aún no hay bosquejos guardados</div>'; return; }
  list.innerHTML='';
  hist.forEach(entry=>{
    const item=document.createElement('div');
    item.className='hist-item'+(entry.id===currentHistId?' loaded':'');
    item.innerHTML=`<div class="hist-info"><div class="hist-title">${entry.title}</div><div class="hist-date">${entry.date}</div></div><button class="hist-del">×</button>`;
    item.querySelector('.hist-del').addEventListener('click',e=>deleteFromHistorial(entry.id,e));
    item.addEventListener('click',()=>loadFromHistorial(entry));
    list.appendChild(item);
  });
}

/* ── PWA ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
